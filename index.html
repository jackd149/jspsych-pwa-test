<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Project Sprouts</title>

    <link rel="stylesheet" href="https://unpkg.com/jspsych@8.3.0/css/jspsych.css" />
    <script src="https://unpkg.com/jspsych@8.3.0/dist/index.browser.min.js"></script>
    <script src="https://unpkg.com/@jspsych/offline-storage@0.4.0/dist/index.browser.js"></script>
    <script src="https://unpkg.com/@jspsych/plugin-video-button-response@2.1.0/dist/index.browser.min.js"></script>
    <script src="https://unpkg.com/@jspsych-contrib/plugin-video-hotspots@1.1.0/dist/index.browser.min.js"></script>

    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; min-height: 100%; margin: 0; }
      body { font-family: system-ui, sans-serif; background: #eef4ec; color: #173a2e; }
      [hidden] { display: none !important; }

      #start-screen {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        text-align: center;
      }
      #start-screen h1 { margin: 0 0 12px; font-size: clamp(2.5rem, 7vw, 4rem); }
      #start-screen p { max-width: 32rem; margin: 0 0 24px; line-height: 1.5; }
      button {
        min-height: 52px;
        border: 0;
        border-radius: 12px;
        padding: 12px 22px;
        background: #173a2e;
        color: white;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      .start-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
      .study-fields { display: grid; gap: 16px; max-width: 32rem; margin: 0 auto 24px; text-align: left; }
      .study-fields label { display: grid; gap: 6px; font-weight: 700; }
      .study-fields input { width: 100%; min-height: 52px; border: 1px solid #789184; border-radius: 8px; padding: 12px; font: inherit; }
      button:disabled { opacity: 0.45; cursor: not-allowed; }
      #child-start-screen {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        padding: 24px;
        background: white;
      }
      #child-start-screen img { width: min(90vw, 900px); height: 55vh; height: 55dvh; object-fit: contain; }
      #child-start-button {
        background: #31851d;
        min-width: min(70vw, 360px);
        min-height: 100px;
        border-radius: 24px;
        font-size: clamp(2rem, 6vw, 3.5rem);
        touch-action: manipulation;
      }
      .admin-link {
        display: inline-flex;
        align-items: center;
        min-height: 52px;
        border-radius: 12px;
        padding: 12px 22px;
        background: #dcebdd;
        color: #173a2e;
        font-weight: 700;
        text-decoration: none;
      }

      #study-target {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        background: black;
      }
      #study-target .jspsych-content-wrapper,
      #study-target .jspsych-content {
        width: 100%;
        height: 100%;
        max-width: none;
        margin: 0;
        padding: 0;
      }
      #study-target .jspsych-content-wrapper,
      #study-target .jspsych-content {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #study-target .jspsych-content { flex-direction: column; }
      #study-target #jspsych-video-button-response-stimulus {
        display: block;
        margin-inline: auto;
        max-width: 100vw;
        max-height: 100dvh;
        width: auto;
        height: auto;
      }
      .yes-no-video-stage { position: relative; width: min(100vw, 177.7778dvh); aspect-ratio: 16 / 9; }
      #study-target.yes-no-trial #jspsych-video-button-response-stimulus { width: 100%; height: 100%; }
      #study-target.yes-no-trial #jspsych-video-button-response-btngroup {
        position: absolute;
        bottom: 6%;
        left: 0;
        width: 100%;
        z-index: 2;
        display: flex;
        justify-content: space-evenly;
        margin: 0;
        pointer-events: none;
      }
      #study-target.yes-no-trial #jspsych-video-button-response-btngroup button {
        width: 26%;
        max-width: 320px;
        min-height: 0;
        pointer-events: auto;
      }
      #study-target.yes-no-trial #jspsych-video-button-response-btngroup .yes-no-image-button {
        padding: 0;
        background: transparent;
        border: 0;
        touch-action: manipulation;
      }
      .yes-no-image-button img { display: block; width: 100%; height: auto; max-height: 24dvh; object-fit: contain; }
      .yes-no-image-button:active { transform: scale(0.95); }
      #study-target #jspsych-video-hotspots-stimulus {
        display: block;
        width: 1280px;
        height: 720px;
        max-width: none;
        max-height: none;
      }
      #study-target #jspsych-video-hotspots-container { margin: auto; }
      .jspsych-video-hotspots-hotspot { touch-action: manipulation; }
      .jspsych-video-hotspots-hotspot[data-hotspot-id="other"] { cursor: default !important; }
      .complete { padding: 32px; color: white; text-align: center; }
      .complete h2 { margin-top: 0; }
      #study-target.researcher-review { background: #eef4ec; overflow: auto; }
      #study-target.researcher-review .complete { color: #173a2e; }
      #study-target.researcher-review .jspsych-content { height: auto; min-height: 100%; }
      .researcher-review-form { width: min(100%, 640px); padding: 24px; text-align: left; }
      .researcher-review-form h2 { margin-top: 0; }
      .researcher-review-form fieldset { border: 1px solid #789184; border-radius: 12px; margin: 0 0 20px; padding: 16px; }
      .researcher-review-form legend { font-weight: 700; }
      .researcher-review-form fieldset label { display: inline-flex; align-items: center; gap: 8px; min-height: 52px; margin-right: 28px; }
      .researcher-review-form input[type="radio"] { width: 24px; height: 24px; accent-color: #173a2e; }
      .researcher-review-form textarea { display: block; width: 100%; margin: 8px 0 24px; padding: 12px; border: 1px solid #789184; border-radius: 8px; font: inherit; resize: vertical; }
    </style>
  </head>

  <body>
    <main id="start-screen">
      <div>
        <h1>Project Sprouts</h1>
        <p>Enter the study IDs and check the headphone volume before handing the tablet to the child.</p>
        <div class="study-fields">
          <label for="subject-id">Subject ID
            <input id="subject-id" type="text" required autocomplete="off" />
          </label>
          <label for="researcher-id">Researcher ID
            <input id="researcher-id" type="text" required autocomplete="off" />
          </label>
        </div>
        <div class="start-actions">
          <button id="start-button" type="button" disabled>Start study</button>
          <button id="sound-check-button" type="button">Sound check</button>
          <a class="admin-link" href="admin/index.html">Researcher tools</a>
        </div>
        <p id="sound-check-status" role="status" style="margin: 16px auto 0;"></p>
        <audio id="sound-check-audio" src="https://raw.githubusercontent.com/efosterhanson/CHS_stims/main/ProjectSprouts/warmup_trial_correct_audio.mp3" preload="auto"></audio>
      </div>
    </main>

    <section id="child-start-screen" aria-label="Ready to play" hidden>
      <img src="https://raw.githubusercontent.com/efosterhanson/CHS_stims/main/Tablet_Study1_Videos/Ready.png" alt="Kid Lab chameleon saying: Ready? Let's play!" />
      <button id="child-start-button" type="button">START</button>
    </section>

    <div id="study-target" hidden></div>

    <script src="experiment.js"></script>
  </body>
</html>
